[package]
name = "dicebag"
version = "0.3.37"
edition = "2024"
description = "Chaotic dice rolling!"
license = "MIT OR Apache-2.0"
authors = ["Markku Sukanen <markku.sukanen@gmail.com>"]
repository = "https://github.com/msukanen/dice.git"

[dependencies]
num = "0.4"
paste = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4"
rand_xoshiro = "0.8.1"

[dev-dependencies]
env_logger = "0.11"
nohash = "0.2.0"

[features]
default = []
f128-stable = []
experimental = []
# some test-only features
# test-xoshiro-only = []
d100-00-to-99 = []
