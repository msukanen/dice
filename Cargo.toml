[package]
name = "dicebag"
version = "0.3.25"
edition = "2024"
description = "Chaotic dice rolling!"
license = "MIT OR Apache-2.0"
authors = ["Markku Sukanen <markku.sukanen@gmail.com>"]
repository = "https://github.com/msukanen/dice.git"

[dependencies]
num = "0.4"
paste = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
log = "0.4"
env_logger = "0.11"
